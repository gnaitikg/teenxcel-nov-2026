    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="background">
      <div class="gradient-sphere"></div>
      <div class="gradient-sphere"></div>
      <div class="gradient-sphere"></div>
    </div>
    <div class="noise"></div>
    <div id="app">
      <div class="card">
        <div class="headline">
          <h1>WANT A CALL?</h1>
          <p>Not sure which course to choose? 
            <br>Fill out this form and we will contact you soon.</p>
        </div>
        <form id="contact-form">
          <div class="form-group">
            <input type="text" id="name" name="name" placeholder="Name" required>
          </div>
          <div class="form-group">
            <input type="tel" id="number" name="phone" placeholder="Phone Number" required>
          </div>
          <div class="form-group">
            <input type="text" id="school" name="school" placeholder="School/College Name" required>
          </div>
          <div class="form-group">
            <input type="text" id="sem" name="sem" placeholder="Class/Semester" required>
          </div>
          <button type="submit" id="submit-button">
            <span class="button-text">Submit</span>
            <span class="button-loader"></span>
          </button>
        </form>
      </div>
    </div>
    <div id="success-message" >
      <div class="success-content">
        <div id="sparkle-container"></div>
        <h2>We got your inquiry!</h2>
        <p>We will contact you within the next 3 days.</p>
        <p class="small-text">(If you do not hear from us, please message us on WhatsApp from the Contact Us page.)</p>
      </div>
    </div>
    <script src="/assets/js/call/script.js"></script>
  </body>
