<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Details | TeenXcel</title>
  <meta name="description" content="View the details of a TeenXcel course.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://teenxcel.in/courses/all/project/singlecourse/">
  <meta property="og:site_name" content="TeenXcel">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="en_IN">
  <meta property="og:title" content="Course Details | TeenXcel">
  <meta property="og:description" content="View the details of a TeenXcel course.">
  <meta property="og:url" content="https://teenxcel.in/courses/all/project/singlecourse/">
  <meta property="og:image" content="https://teenxcel.in/assets/images/brand/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="TeenXcel logo">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://teenxcel.in/assets/images/brand/og-image.png">
  <meta name="twitter:title" content="Course Details | TeenXcel">
  <meta name="twitter:description" content="View the details of a TeenXcel course.">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/brand/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/brand/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/brand/apple-touch-icon.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Base Styles */
        :root {
            --color-primary: #2563eb;
            --color-primary-dark: #1d4ed8;
            --color-secondary: #e5e7eb;
            --color-text: #1f2937;
            --color-text-light: #6b7280;
            --color-background: #ffffff;
            --color-accent: #f59e0b;
            --color-accent-dark: #d97706;
            --color-success: #10b981;
            --color-error: #ef4444;
            --color-border: #e5e7eb;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --border-radius: 8px;
            --transition-speed: 0.3s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            line-height: 1.5;
            color: var(--color-text);
            background-color: #f9fafb;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-weight: 600;
            line-height: 1.2;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 2rem;
            letter-spacing: -0.025em;
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            position: relative;
            padding-bottom: 0.5rem;
        }

        h2::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            width: 50px;
            height: 3px;
            background-color: var(--color-accent);
            border-radius: 3px;
        }

        h3 {
            font-size: 1.25rem;
            margin-bottom: 0.75rem;
        }

        p {
            margin-bottom: 1rem;
        }

        img {
            max-width: 100%;
            display: block;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        /* Course Header */
        .course-header {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            margin: 2rem 0;
            padding: 2rem;
            background-color: var(--color-background);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            animation: fadeIn 0.8s ease-out;
        }

        .course-thumbnail {
            width: 100%;
            overflow: hidden;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-sm);
        }

        .course-thumbnail img {
            width: 100%;
            height: auto;
            object-fit: cover;
            transition: transform var(--transition-speed);
            animation: scaleIn 1s ease-out;
        }

        .course-thumbnail img:hover {
            transform: scale(1.03);
        }

        .course-info {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .course-meta {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            align-items: flex-start;
        }

        .price-container {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .price {
            font-size: 2rem;
            font-weight: 700;
            color: var(--color-text);
        }

        .price.discounted {
            color: var(--color-success);
            animation: fadeIn 0.5s ease-in-out;
        }

        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            width: 100%;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 500;
            border-radius: var(--border-radius);
            border: none;
            cursor: pointer;
            transition: all var(--transition-speed);
            text-align: center;
            text-decoration: none;
        }

        .btn-primary {
            background-color: var(--color-primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--color-primary-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            animation: pulse 1s infinite;
        }

        .btn-primary:active {
            transform: translateY(0);
            box-shadow: var(--shadow-sm);
        }

        .btn-secondary {
            background-color: var(--color-secondary);
            color: var(--color-text);
        }

        .btn-secondary:hover {
            background-color: #d1d5db;
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .btn-secondary:active {
            transform: translateY(0);
        }

        /* Content Sections */
        .content-wrapper {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            margin-bottom: 3rem;
        }

        section {
            padding: 2rem;
            background-color: var(--color-background);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
        }

        /* About Course Section */
        .about-course {
            animation-delay: 0.2s;
        }

        .course-detail {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .course-detail i {
            width: 20px;
            text-align: center;
        }

        /* What You Learn Section */
        .what-you-learn {
            animation-delay: 0.4s;
        }

        .learning-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        .learning-item {
            display: flex;
            gap: 1rem;
            padding: 1.5rem;
            background-color: #f9fafb;
            border-radius: var(--border-radius);
            transition: transform var(--transition-speed), box-shadow var(--transition-speed);
            opacity: 0;
            animation: fadeIn 0.5s ease-out forwards;
        }

        .learning-item:nth-child(1) {
            animation-delay: 0.1s;
        }

        .learning-item:nth-child(2) {
            animation-delay: 0.2s;
        }

        .learning-item:nth-child(3) {
            animation-delay: 0.3s;
        }

        .learning-item:nth-child(4) {
            animation-delay: 0.4s;
        }

        .learning-item:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-md);
        }

        .learning-icon {
            font-size: 1.5rem;
            color: var(--color-accent);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 3rem;
            height: 3rem;
            border-radius: 50%;
            flex-shrink: 0;
            background-color: rgba(245, 158, 11, 0.1);
        }

        .learning-content {
            flex: 1;
        }

        .learning-content h3 {
            color: var(--color-text);
            margin-bottom: 0.5rem;
        }

        /* About Mentor Section */
        .about-mentor {
            animation-delay: 0.6s;
        }

        .mentor-profile {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .mentor-image {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: var(--shadow-md);
            border: 3px solid var(--color-accent);
        }

        .mentor-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .mentor-details {
            flex: 1;
        }

        .mentor-title {
            font-size: 1.1rem;
            color: var(--color-accent);
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .mentor-bio {
            margin-bottom: 1.5rem;
        }

        .social-links {
            display: flex;
            gap: 1rem;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #f3f4f6;
            color: var(--color-text);
            transition: all var(--transition-speed);
        }

        .social-icon {
            width: 20px;
            height: 20px;
        }

        .social-link:hover {
            background-color: var(--color-primary);
            color: white;
            transform: translateY(-3px);
            box-shadow: var(--shadow-sm);
            animation: pulse 0.5s;
        }

        /* Animation Styles */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        /* Initially hide elements for animation */
        .about-course,
        .what-you-learn,
        .about-mentor {
            animation: fadeIn 0.8s ease-out;
            animation-fill-mode: both;
        }

        /* Loading and Error States */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            text-align: center;
            padding: 2rem;
        }

        .loading-spinner {
            border: 4px solid var(--color-secondary);
            border-top: 4px solid var(--color-primary);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .error-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            text-align: center;
            padding: 2rem;
        }

        .error-icon {
            font-size: 3rem;
            color: var(--color-error);
            margin-bottom: 1rem;
        }

        /* Responsive Styles */
        @media (min-width: 640px) {
            h1 {
                font-size: 2.25rem;
            }

            .learning-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .course-meta {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }

            .btn {
                min-width: 160px;
            }
        }

        @media (min-width: 768px) {
            .container {
                max-width: 90%;
                margin: 0 auto;
            }

            .course-header {
                flex-direction: row;
                align-items: flex-start;
                gap: 2.5rem;
            }

            .course-thumbnail {
                width: 40%;
                max-width: 500px;
                flex-shrink: 0;
            }

            .course-info {
                flex: 1;
            }

            .mentor-profile {
                flex-direction: row;
                align-items: center;
                gap: 2.5rem;
            }

            .mentor-image {
                width: 180px;
                height: 180px;
            }
        }

        @media (min-width: 1024px) {
            .container {
                max-width: 1100px;
                padding: 2rem;
            }

            h1 {
                font-size: 2.5rem;
            }

            .course-header {
                margin: 3rem 0;
                padding: 2.5rem;
            }

            .content-wrapper {
                gap: 2.5rem;
            }

            section {
                padding: 2.5rem;
            }

            .learning-item {
                padding: 1.75rem;
            }
        }

        @media (min-width: 1280px) {
            .container {
                max-width: 1200px;
            }

            h1 {
                font-size: 2.75rem;
            }

            .course-header {
                padding: 3rem;
            }

            .price-container {
                flex-direction: row;
                align-items: baseline;
            }
        }
    </style>
  <script src="/assets/js/legacy-paths.js"></script>
</head>

<body class="loaded">
    <main class="container" id="main-container">
        <div class="loading-container" id="loading-container">
            <div class="loading-spinner"></div>
            <h2>Loading course information...</h2>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Get course code from URL
            const urlParams = new URLSearchParams(window.location.search);
            let courseCode = urlParams.get('courseCode');

            // If not in URL params, extract from path
            if (!courseCode) {
                const pathParts = window.location.pathname.split('/');
                courseCode = pathParts[pathParts.length - 1];
            }

            // If still no courseCode, use default
            if (!courseCode) {
                courseCode = 'ETH-HCK';
            }

            // Fetch course data
            fetchCourseData(courseCode);
        });

        function fetchCourseData(courseCode) {
            fetch(`https://teenxcel-production.up.railway.app/api/courses/get-course/${courseCode}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(responseData => {
                    if (responseData.success) {
                        renderCourse(responseData.data);
                    } else {
                        showError('Failed to load course: ' + responseData.message);
                    }
                })
                .catch(error => {
                    console.error('Error fetching course data:', error);
                    showError('Failed to load course. Please try again later.');
                });
        }

        function renderCourse(courseData) {
            const mainContainer = document.getElementById('main-container');

            // Remove loading container
            document.getElementById('loading-container').remove();

            // Create course header section
            const courseHeader = document.createElement('section');
            courseHeader.className = 'course-header';

            const objectives = courseData.objectives ? courseData.objectives.split('#$#').map(item => item.trim()) : [];

            courseHeader.innerHTML = `
                <div class="course-thumbnail">
                    <img src="${txAsset(courseData.img) || '/api/placeholder/480/300'}" alt="${courseData.title}" onerror="this.src='/api/placeholder/480/300'">
                </div>
                <div class="course-info">
                    <h1>${courseData.title}</h1>
                    <div class="course-meta">
                        <div class="price-container">
                            <span id="original-price" class="price">₹${courseData.price}</span>
                        </div>
                        <div class="action-buttons">
                            <a href="/courses/all/project/enroll/?courseCode=${courseData.courseCode}" class="btn btn-primary">Enroll Now</a>
                            <a href="/courses/all/project/" class="btn btn-secondary">View All</a>
                        </div>
                    </div>
                </div>
            `;


            // Create content wrapper
            const contentWrapper = document.createElement('div');
            contentWrapper.className = 'content-wrapper';

            // About course section
            const aboutCourse = document.createElement('section');
            aboutCourse.className = 'about-course';
            aboutCourse.innerHTML = `
                <h2>About This Course</h2>
                <div class="course-detail">
                    <i style="color: rgb(0, 110, 255);" class="fas fa-clock"></i>
                    <span class="course-duration">Duration: ${courseData.duration}</span>
                </div>
                <div class="course-detail">
                    <i style="color: rgb(255, 0, 0);" class="fas fa-graduation-cap"></i>
                    <span class="course-level">Level: ${courseData.level}</span>
                </div>
                <p>${courseData.description}</p>
            `;

            // What you learn section
            const whatYouLearn = document.createElement('section');
            whatYouLearn.className = 'what-you-learn';

            let learningItemsHTML = '';
            const icons = ['fas fa-book', 'fas fa-shield-alt', 'fas fa-tools', 'fas fa-lock'];

            objectives.forEach((objective, index) => {
                const iconIndex = index % icons.length;
                learningItemsHTML += `
                    <div class="learning-item">
                        <div class="learning-icon">
                            <i class="${icons[iconIndex]}"></i>
                        </div>
                        <div class="learning-content">
                            <h3>${objective}</h3>
                        </div>
                    </div>
                `;
            });

            whatYouLearn.innerHTML = `
                <h2>What You Will Learn</h2>
                <div class="learning-grid">
                    ${learningItemsHTML}
                </div>
            `;

            // About mentor section
            const aboutMentor = document.createElement('section');
            aboutMentor.className = 'about-mentor';
            aboutMentor.innerHTML = `
                <h2>About Your Mentor</h2>
                <div class="mentor-profile">
                    <div class="mentor-image">
                        <img src="${txAsset(courseData.mentorImg) || '/api/placeholder/180/180'}" alt="${courseData.mentorName}" onerror="this.src='/api/placeholder/180/180'">
                    </div>
                    <div class="mentor-details">
                        <h3>${courseData.mentorName}</h3>
                        <p class="mentor-title">${courseData.mentorDesignation}</p>
                        <p class="mentor-bio">${courseData.mentorDesc}</p>
                        <div class="social-links">
                            <a href="#" class="social-link linkedin" aria-label="LinkedIn Profile">
                                <svg class="social-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path
                                        d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z">
                                    </path>
                                    <rect x="2" y="9" width="4" height="12"></rect>
                                    <circle cx="4" cy="4" r="2"></circle>
                                </svg>
                            </a>
                            <a href="#" class="social-link portfolio" aria-label="Portfolio">
                                <svg class="social-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                                    <path d="M2 17l10 5 10-5"></path>
                                    <path d="M2 12l10 5 10-5"></path>
                                </svg>
                            </a>
                        </div>
                    </div>
                </div>
            `;

            // Append sections to content wrapper
            contentWrapper.appendChild(aboutCourse);
            contentWrapper.appendChild(whatYouLearn);
            contentWrapper.appendChild(aboutMentor);

            // Append all to main container
            mainContainer.appendChild(courseHeader);
            mainContainer.appendChild(contentWrapper);

            // Trigger animations after content is loaded
            document.body.classList.add('loaded');
        }

        function showError(message) {
            const mainContainer = document.getElementById('main-container');

            // Remove loading container
            document.getElementById('loading-container').remove();

            // Create error container
            const errorContainer = document.createElement('div');
            errorContainer.className = 'error-container';
            errorContainer.innerHTML = `
                <div class="error-icon">
                    <i class="fas fa-exclamation-triangle"></i>
                </div>
                <h2>Something went wrong</h2>
                <p>${message}</p>
                <a href="/" class="btn btn-primary" style="margin-top: 1rem;">Go to Homepage</a>
            `;

            mainContainer.appendChild(errorContainer);
        }
    </script>
</body>

</html>
