<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All TeenXcel Courses – Cyber Security, Development &amp; Design</title>
  <meta name="description" content="Browse all TeenXcel courses by category: cyber security, AI, development, design and multimedia, and our most popular courses.">
  <meta name="robots" content="index, follow">

  <meta property="og:site_name" content="TeenXcel">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="en_IN">
  <meta property="og:title" content="All TeenXcel Courses – Cyber Security, Development &amp; Design">
  <meta property="og:description" content="Browse all TeenXcel courses by category: cyber security, AI, development, design and multimedia, and our most popular courses.">
  <meta property="og:url" content="https://teenxcel.in/courses/all/project/">
  <meta property="og:image" content="https://teenxcel.in/assets/images/brand/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="TeenXcel logo">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://teenxcel.in/assets/images/brand/og-image.png">
  <meta name="twitter:title" content="All TeenXcel Courses – Cyber Security, Development &amp; Design">
  <meta name="twitter:description" content="Browse all TeenXcel courses by category: cyber security, AI, development, design and multimedia, and our most popular courses.">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/brand/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/brand/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/brand/apple-touch-icon.png">
    <style>
        /* Base styles */
        :root {
            --color-bg: #0c0c10;
            --color-text: #ffffff;
            --color-primary: #6366f1;
            --color-secondary: #818cf8;
            --color-surface: rgba(23, 23, 33, 0.95);
            --color-border: rgba(255, 255, 255, 0.1);
            --color-accent-cyber: #10b981;
            --color-accent-ai: #f59e0b;
            --color-accent-dev: #8b5cf6;
            --color-accent-popular: #ef4444;
            --color-accent-design: #ec4899;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Header */
        h1 {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        /* Filter Section */
        .filter-section {
            margin-bottom: 2rem;
            text-align: center;
        }

        .filter-title {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            opacity: 0.9;
        }

        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .filter-btn {
            padding: 0.75rem 1.5rem;
            border: 2px solid var(--color-border);
            background: transparent;
            color: var(--color-text);
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .filter-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.3s ease;
        }

        .filter-btn:hover::before {
            left: 100%;
        }

        .filter-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .filter-btn.active {
            background: var(--color-primary);
            color: white;
            border-color: var(--color-primary);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
        }

        /* Category specific colors */
        .filter-btn[data-category="cyber security"].active {
            background: var(--color-accent-cyber);
            border-color: var(--color-accent-cyber);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
        }

        .filter-btn[data-category="ai"].active {
            background: var(--color-accent-ai);
            border-color: var(--color-accent-ai);
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
        }

        .filter-btn[data-category="development"].active {
            background: var(--color-accent-dev);
            border-color: var(--color-accent-dev);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
        }

        .filter-btn[data-category="most popular"].active {
            background: var(--color-accent-popular);
            border-color: var(--color-accent-popular);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
        }

        .filter-btn[data-category="design & multimedia"].active {
            background: var(--color-accent-design);
            border-color: var(--color-accent-design);
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.4);
        }

        /* Course counter */
        .course-counter {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            margin-bottom: 2rem;
            transition: all 0.3s ease;
        }

        /* Course Grid */
        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            padding: 2rem 0;
            transition: all 0.3s ease;
        }

        .course-card {
            background: var(--color-surface);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--color-border);
            transition: all 0.5s ease;
            /* Slowed down from 0.3s to 0.5s */
            display: flex;
            flex-direction: column;
            opacity: 1;
            transform: translateY(0);
            animation: fadeInUp 0.8s ease-out;
            /* Slowed down from 0.4s to 0.8s */
        }

        .course-card:hover {
            transform: translateY(-5px);
        }

        /* Animation for new cards - slowed down */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

            /* Slower animation duration */
            animation-duration: 0.8s;
            /* Slowed down from 0.4s to 0.8s */
            animation-timing-function: ease-out;
        }

        /* Stagger animation for multiple cards */
        .course-card:nth-child(1) {
            animation-delay: 0.1s;
        }

        .course-card:nth-child(2) {
            animation-delay: 0.2s;
        }

        .course-card:nth-child(3) {
            animation-delay: 0.3s;
        }

        .course-card:nth-child(4) {
            animation-delay: 0.4s;
        }

        .course-card:nth-child(5) {
            animation-delay: 0.5s;
        }

        .course-card:nth-child(6) {
            animation-delay: 0.6s;
        }

        .course-card:nth-child(7) {
            animation-delay: 0.7s;
        }

        .course-card:nth-child(8) {
            animation-delay: 0.8s;
        }

        .course-card:nth-child(9) {
            animation-delay: 0.9s;
        }

        /* Course image with skeleton loading */
        .course-image {
            position: relative;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background: linear-gradient(90deg, #2a2a3c 25%, #3a3a4c 50%, #2a2a3c 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
        }

        @keyframes skeleton-loading {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        /* Slower animation applied to all skeleton elements */
        .course-image,
        .skeleton-title,
        .skeleton-detail {
            animation-duration: 3s;
            /* Slowed down from 1.5s to 3s */
        }

        .course-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: all 0.3s ease;
            opacity: 0;
        }

        .course-image img.loaded {
            opacity: 1;
        }

        .course-image.loaded {
            animation: none;
            background: none;
        }

        .course-card:hover .course-image img {
            transform: scale(1.05);
        }

        .course-card h3 {
            font-size: 1.25rem;
            padding: 1rem;
            padding-bottom: 0.5rem;
            flex-grow: 1;
        }

        .course-card .course-details {
            padding: 0 1rem 1rem;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.875rem;
        }

        .course-card .course-details p {
            margin-bottom: 0.5rem;
        }

        /* Category badge - moved to right corner */
        .category-badge {
            position: absolute;
            bottom: 1rem;
            right: 1rem;
            /* Changed from left to right */
            padding: 0.25rem 0.75rem;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .course-card:hover .category-badge {
            transform: translateY(-2px);
        }

        .category-badge.cyber-security {
            background: var(--color-accent-cyber);
        }

        .category-badge.ai {
            background: var(--color-accent-ai);
        }

        .category-badge.development {
            background: var(--color-accent-dev);
        }

        .category-badge.most-popular {
            background: var(--color-accent-popular);
        }

        .category-badge.design-multimedia {
            background: var(--color-accent-design);
        }

        /* Enhanced skeleton loading effects for all card elements */
        .skeleton-title,
        .skeleton-detail {
            background: linear-gradient(90deg, #2a2a3c 25%, #3a3a4c 50%, #2a2a3c 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
            border-radius: 4px;
            height: 16px;
            margin-bottom: 8px;
        }

        .skeleton-title {
            height: 24px;
            margin: 1rem;
            width: 80%;
        }

        .skeleton-details {
            padding: 0 1rem 1rem;
        }

        .skeleton-detail:nth-child(1) {
            width: 60%;
        }

        .skeleton-detail:nth-child(2) {
            width: 40%;
        }

        .skeleton-detail:nth-child(3) {
            width: 70%;
        }

        .skeleton-detail:nth-child(4) {
            width: 50%;
        }

        /* Footer */
        footer {
            margin-top: auto;
            background: var(--color-surface);
            border-top: 1px solid var(--color-border);
            padding: 2rem 0;
        }

        footer .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .social-links {
            display: flex;
            gap: 1.5rem;
        }

        .social-links a {
            color: var(--color-text);
            text-decoration: none;
            opacity: 0.7;
            transition: opacity 0.2s ease;
        }

        .social-links a:hover {
            opacity: 1;
        }

        /* Loading and Error States */
        .loading,
        .error {
            text-align: center;
            padding: 2rem;
            font-size: 1.2rem;
        }

        /* Loading spinner */
        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            margin: 20px;
            border: 4px solid rgba(99, 102, 241, 0.3);
            border-radius: 50%;
            border-top-color: var(--color-primary);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Filter animation overlay */
        .filter-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(12, 12, 16, 0.1);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .filter-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            h1 {
                font-size: 2rem;
            }

            .filter-buttons {
                gap: 0.5rem;
            }

            .filter-btn {
                padding: 0.6rem 1.2rem;
                font-size: 0.8rem;
            }

            footer .container {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }
        }
    </style>
  <script src="/assets/js/legacy-paths.js"></script>
</head>

<body>
    <main class="container">
        <h1>All Courses</h1>

        <!-- Filter Section -->
        <div class="filter-section">
            <!-- <h2 class="filter-title">Filter by Category</h2> -->
            <div class="filter-buttons">
                <button class="filter-btn active" data-category="all">All Courses</button>
                <button class="filter-btn" data-category="cyber security">🔒 Cyber Security</button>
                <button class="filter-btn" data-category="ai">🤖 AI</button>
                <button class="filter-btn" data-category="development">💻 Development</button>
                <button class="filter-btn" data-category="most popular">🔥 Most Popular</button>
                <button class="filter-btn" data-category="design & multimedia">🎨 Design & Multimedia</button>
            </div>
            <div class="course-counter">
                <span id="course-count">0</span> courses available
            </div>
        </div>

        <div id="courses-grid" class="courses-grid">
            <!-- Courses will be dynamically inserted here -->
        </div>
    </main>

    <!-- Filter overlay for smooth transitions -->
    <div class="filter-overlay" id="filter-overlay"></div>

    <footer>
        <div class="container">
            <p>&copy; 2025 Course Collection. All rights reserved.</p>
            <div class="social-links">
                <a href="#" aria-label="Twitter">Twitter</a>
                <a href="#" aria-label="Instagram">Instagram</a>
                <a href="#" aria-label="LinkedIn">LinkedIn</a>
            </div>
        </div>
    </footer>

    <script>
        let allCourses = [];
        let activeFilter = 'all';
        let isFiltering = false;

        // Function to get category CSS class
        function getCategoryClass(category) {
            if (!category) return 'unknown';
            return category.toLowerCase().replace(/\s+/g, '-').replace(/&/g, '');
        }

        // Function to handle image loading
        function handleImageLoad(img, courseImage) {
            img.onload = () => {
                img.classList.add('loaded');
                courseImage.classList.add('loaded');
            };

            img.onerror = () => {
                courseImage.classList.add('loaded');
                // Set a placeholder or default image
                img.src = '/api/placeholder/400/240';
            };
        }

        // Function to create skeleton loading cards
        function createSkeletonCards(count = 6) {
            const coursesGrid = document.getElementById('courses-grid');
            coursesGrid.innerHTML = '';

            for (let i = 0; i < count; i++) {
                const skeletonCard = document.createElement('div');
                skeletonCard.classList.add('course-card');
                skeletonCard.style.animationDelay = `${i * 0.1}s`;

                skeletonCard.innerHTML = `
                    <div class="course-image"></div>
                    <div class="skeleton-title"></div>
                    <div class="skeleton-details">
                        <div class="skeleton-detail"></div>
                        <div class="skeleton-detail"></div>
                        <div class="skeleton-detail"></div>
                        <div class="skeleton-detail"></div>
                    </div>
                `;

                coursesGrid.appendChild(skeletonCard);
            }
        }

        // Function to render courses
        function renderCourses(courses) {
            const coursesGrid = document.getElementById('courses-grid');
            coursesGrid.innerHTML = '';

            courses.forEach((course, index) => {
                const courseCard = document.createElement('div');
                courseCard.classList.add('course-card');
                courseCard.dataset.category = course.category?.toLowerCase() || '';

                // Reset animation
                courseCard.style.animationDelay = `${index * 0.1}s`;

                const courseImage = document.createElement('div');
                courseImage.classList.add('course-image');

                const img = document.createElement('img');
                img.src = txAsset(course.img);
                img.alt = `${course.title} Course`;

                // Handle image loading
                handleImageLoad(img, courseImage);

                courseImage.appendChild(img);

                if (course.category) {
                    const badge = document.createElement('div');
                    badge.classList.add('category-badge', getCategoryClass(course.category));
                    badge.textContent = course.category;
                    courseImage.appendChild(badge);
                }

                courseCard.innerHTML = `
                    <a style="text-decoration: none; color: white" href="/courses/all/project/singlecourse/?courseCode=${course.courseCode}" class="course-link">
                        <div class="course-image-placeholder"></div>
                        <h3>${course.title}</h3>
                        <div class="course-details">
                            <p><strong>Course Code:</strong> ${course.courseCode}</p>
                            <p><strong>Level:</strong> ${course.level}</p>
                            <p><strong>Duration:</strong> ${course.duration}</p>
                            <p><strong>Price:</strong> ₹${course.price}</p>
                        </div>
                    </a>
                `;

                // Replace placeholder with actual image
                const placeholder = courseCard.querySelector('.course-image-placeholder');
                placeholder.replaceWith(courseImage);

                coursesGrid.appendChild(courseCard);
            });
        }

        // Function to filter courses with animation
        async function filterCourses(category) {
            if (isFiltering) return;

            activeFilter = category;
            isFiltering = true;

            // Show overlay
            const overlay = document.getElementById('filter-overlay');
            overlay.classList.add('show');

            // Update button states
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[data-category="${category}"]`).classList.add('active');

            // Show skeleton loading during filtering
            createSkeletonCards(6);

            // Add a small delay for smooth transition
            await new Promise(resolve => setTimeout(resolve, 500));

            // Filter courses
            let filteredCourses;
            if (category === 'all') {
                filteredCourses = allCourses;
            } else {
                filteredCourses = allCourses.filter(course =>
                    course.category?.toLowerCase() === category.toLowerCase()
                );
            }

            // Re-render with filtered courses
            renderCourses(filteredCourses);

            // Update counter
            document.getElementById('course-count').textContent = filteredCourses.length;

            // Hide overlay
            setTimeout(() => {
                overlay.classList.remove('show');
                isFiltering = false;
            }, 400);
        }

        // Function to fetch courses
        async function fetchCourses() {
            try {
                // Show skeleton loading initially
                createSkeletonCards(8);

                // Fetch courses from the API
                const response = await fetch('https://teenxcel-production.up.railway.app/api/courses/get-all');

                if (!response.ok) {
                    throw new Error('Failed to fetch courses');
                }

                const { data } = await response.json();
                allCourses = data;

                // Add a small delay to see the skeleton effect
                setTimeout(() => {
                    // Initial render with all courses
                    renderCourses(allCourses);

                    // Initial count
                    document.getElementById('course-count').textContent = data.length;
                }, 800);

            } catch (error) {
                // Show error state
                const coursesGrid = document.getElementById('courses-grid');
                coursesGrid.innerHTML = `
                    <div class="error">
                        <p>Error loading courses: ${error.message}</p>
                        <p style="opacity: 0.7; margin-top: 1rem;">Please try again later.</p>
                    </div>
                `;
                console.error('Courses fetch error:', error);
            }
        }

        // Add event listeners to filter buttons
        document.addEventListener('DOMContentLoaded', () => {
            fetchCourses();

            // Add click event listeners to filter buttons
            document.querySelectorAll('.filter-btn').forEach(button => {
                button.addEventListener('click', () => {
                    const category = button.dataset.category;
                    filterCourses(category);
                });
            });
        });
    </script>
</body>

</html>
